# ──────────────────────────────────────────────────────────────────────────────
# AR EduVision — local development stack
#
# Starts a PostgreSQL 16 instance that exactly matches the defaults in
# application.yml so the Spring Boot backend connects with zero extra config.
#
# Usage:
#   docker compose up -d          # start Postgres in the background
#   docker compose down           # stop and remove containers (data kept)
#   docker compose down -v        # stop AND wipe the database volume
#
# Then run the backend:
#   cd backend && mvn spring-boot:run
#   (no extra env vars needed for local dev — defaults match this file)
#
# To run with the embedded H2 instead (no Docker required):
#   cd backend && mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ──────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    container_name: eduvision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       eduvision
      POSTGRES_USER:     eduvision
      POSTGRES_PASSWORD: eduvision_dev
    ports:
      - "5432:5432"        # exposes Postgres on localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduvision -d eduvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Optional: pgAdmin web UI for browsing the database ──────────────────────
  # Remove this block if you don't need a GUI.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eduvision_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@eduvision.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"             # open http://localhost:5050 in your browser
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
