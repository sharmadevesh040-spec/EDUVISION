server:
  port: 8080

spring:
  application:
    name: eduvision-backend

  # ──────────────────────────────────────────────────────────────────────────
  # Database — PostgreSQL (production default)
  #
  # Override every value via environment variables so you never commit
  # real credentials.  A docker-compose.yml at the project root spins up a
  # local Postgres instance that matches these defaults out-of-the-box.
  # ──────────────────────────────────────────────────────────────────────────
  datasource:
    url: ${EDUVISION_DB_URL:jdbc:postgresql://localhost:5432/eduvision}
    username: ${EDUVISION_DB_USER:eduvision}
    password: ${EDUVISION_DB_PASS:eduvision_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: EduVisionPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000   # 30 s
      idle-timeout: 600000        # 10 min
      max-lifetime: 1800000       # 30 min

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 'update' keeps the schema in sync during development.
      # Switch to 'validate' (or use Flyway) in production.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# ────────────────────────────────────────────────────────────────────────────
# AR EduVision settings
# ────────────────────────────────────────────────────────────────────────────
eduvision:
  jwt:
    # Always override via EDUVISION_JWT_SECRET in production.
    secret: ${EDUVISION_JWT_SECRET:ar-eduvision-dev-secret-key-change-me-in-production-2026}
    ttl-hours: 12
  ai:
    # Leave the API key EMPTY to run the tutor fully offline.
    api-key: ${EDUVISION_AI_API_KEY:}
    url: ${EDUVISION_AI_URL:https://api.openai.com/v1/chat/completions}
    model: ${EDUVISION_AI_MODEL:gpt-4o-mini}

logging:
  level:
    root: INFO
    com.eduvision: INFO

---
# ────────────────────────────────────────────────────────────────────────────
# "dev" profile  –  uses embedded H2 so you can run locally without Docker.
# Activate with: java -jar ... --spring.profiles.active=dev
#             or set SPRING_PROFILES_ACTIVE=dev in your IDE run config.
# ────────────────────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:./data/eduvision
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true   # available at http://localhost:8080/h2-console
